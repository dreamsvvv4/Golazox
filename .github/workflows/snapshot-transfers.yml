name: Auto-update transfers snapshot

# Actualiza el snapshot de fichajes de Transfermarkt automáticamente, sin depender
# de ninguna PC encendida. Transfermarkt (Datadome) bloquea las IP de datacenter
# con un challenge JS, así que se usa Chromium headless (Playwright) que sí lo
# resuelve. Genera data/transfers_snapshot.json, lo commitea y lo despliega a prod.

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (00, 06, 12, 18 UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: transfers-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match_engine/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Instalamos SOLO lo necesario en un directorio aislado para no arrastrar
          # todo package.json (puppeteer/sharp/ffmpeg y sus postinstall pesados que
          # rompen el install). El script las resuelve vía NODE_PATH.
          mkdir -p /tmp/deps
          cd /tmp/deps
          npm init -y >/dev/null 2>&1
          npm i cheerio@1 node-fetch@2 playwright@1.47.0
          npx playwright install chromium --with-deps
          echo "NODE_PATH=/tmp/deps/node_modules" >> "$GITHUB_ENV"

      - name: Generate snapshot (headless Chromium)
        run: node _snapshot_ci.js

      - name: Commit snapshot
        id: commit
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add match_engine/webapp/data/transfers_snapshot.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el snapshot."
          else
            git commit -m "chore: auto-actualizar snapshot de fichajes [skip ci]"
            git pull --rebase origin main
            git push
          fi
          # No hace falta desplegar por SSH: el servidor de producción descarga
          # este snapshot directamente de raw.githubusercontent.com (news.js ->
          # _refreshSnapshotFromGitHub) en cuanto expira su caché (~30 min). GitHub
          # no está bloqueado desde el server (solo Transfermarkt lo está).

