name: Auto-update transfers snapshot

# Actualiza el snapshot de fichajes de Transfermarkt automáticamente, sin depender
# de ninguna PC encendida. Transfermarkt (Datadome) bloquea las IP de datacenter
# con un challenge JS, así que se usa Chromium headless (Playwright) que sí lo
# resuelve. Genera data/transfers_snapshot.json, lo commitea y lo despliega a prod.

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (00, 06, 12, 18 UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions
  push:                       # se ejecuta al cambiar la propia lógica (para probar)
    branches: [main]
    paths:
      - '.github/workflows/snapshot-transfers.yml'
      - 'match_engine/webapp/_snapshot_ci.js'

permissions:
  contents: write

concurrency:
  group: transfers-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match_engine/webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'   # no bajar el Chromium de puppeteer (no se usa aquí)
        run: |
          npm ci
          npm i playwright@1.47.0 --no-save
          npx playwright install chromium --with-deps

      - name: Generate snapshot (headless Chromium)
        run: node _snapshot_ci.js

      - name: Commit snapshot
        id: commit
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "gh-actions"
          git config user.email "actions@github.com"
          git add match_engine/webapp/data/transfers_snapshot.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en el snapshot."
          else
            git commit -m "chore: auto-actualizar snapshot de fichajes [skip ci]"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.commit.outputs.changed == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          else
            echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "ERROR: SSH key inválida"; exit 1; }
          ssh-keyscan -p 65002 -H 147.93.88.37 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy snapshot to production
        if: steps.commit.outputs.changed == 'true'
        run: |
          ssh -p 65002 -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            u990866731@147.93.88.37 bash <<'EOF'
          set -e
          REPO="$HOME/domains/golazox.com/public_html/.builds/source/repository"
          DEST="$HOME/domains/golazox.com/nodejs"
          cd "$REPO"
          git fetch origin main
          git reset --hard FETCH_HEAD
          mkdir -p "$DEST/data" "$DEST/tmp"
          cp "$REPO/match_engine/webapp/data/transfers_snapshot.json" "$DEST/data/"
          touch "$DEST/tmp/restart.txt"
          echo "Snapshot desplegado y Passenger reiniciado."
          EOF
